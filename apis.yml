aid: vals-ai
name: Vals Ai
description: >-
  Vals AI is an independent AI model evaluation company that publishes
  private, domain-specific benchmarks in legal, tax, finance, medical, and
  coding domains, and operates the Vals Platform - scalable evaluation
  infrastructure that lets labs and engineering teams build test suites,
  run LLM evaluations with LLM-as-judge and expert review, and wire evals
  into CI/CD. Developers work with the platform through the valsai Python
  SDK, the vals CLI, and a GitHub Action; the company is backed by 8VC,
  a16z, and Bloomberg Beta.
